app:
  name: "基于多智能体协作的自动化网络威胁情报监控与预警系统"
  version: "2.1.0"
  env: dev
  log_level: INFO
  timezone: "Asia/Shanghai"

llm:
  provider: openai
  model: ${LLM_MODEL:-gpt-4o-mini}
  api_key: ${LLM_API_KEY:-}
  base_url: ${LLM_BASE_URL:-null}
  temperature: 0.1
  max_tokens: 2048
  max_retries: 3
  timeout: 60
  # Cache responses to reduce cost during development/testing
  cache_enabled: true
  cache_dir: data/llm_cache

storage:
  type: sqlite
  sqlite_path: data/threat_intel.db
  echo: false

collection:
  interval_minutes: 60
  max_concurrent: 5
  request_timeout: 30
  user_agent_rotation: true
  respect_robots_txt: true
  default_delay_seconds: 2

validation:
  confidence_threshold: 0.9
  min_ioc_count: 1
  # Keyword rules for quick pre-filtering
  required_keywords:
    # English signal words (public OSINT)
    - "satellite"
    - "leak"
    - "data breach"
    - "vulnerability"
    - "CVE"
    - "exploit"
    # Chinese + dark-web signal words (multilingual gate; prevents keyword-evasion)
    - "卫星"
    - "地面站"
    - "泄露"
    - "凭据"
    - "勒索"
    - "恶意软件"
    - "后门"
    - "供应链"

# Multi-domain thematic monitoring — scan every raw item against these keyword
# sets and persist per-domain aggregates (see DomainMonitorAgent).
monitor:
  domains:
    satellite:
      display: 卫星/航天
      keywords: ["卫星", "satellite", "地面站", "ground station", "轨道", "star link"]
    ransomware:
      display: 勒索软件
      keywords: ["勒索", "ransomware", "lockbit", "解密", "赎金"]
    apt:
      display: APT 组织
      keywords: ["apt", "国家级", "state-sponsored", "c2", "后门", "钓鱼"]
    supply_chain:
      display: 供应链
      keywords: ["供应链", "supply chain", "投毒", "dependency", "上游依赖"]
    iot_botnet:
      display: IoT 僵尸网络
      keywords: ["iot", "物联网", "botnet", "僵尸网络", "mirai", "ddos"]

darkweb:
  enabled: false  # 合规红线：默认关闭，需显式开启
  proxy:
    type: socks5h
    host: ${DARKWEB_SOCKS_HOST:-}
    port: ${DARKWEB_SOCKS_PORT:-}
  keywords:
    - "勒索"
    - "凭据"
    - "地面站"
    - "botnet"
    - "c2"
  # 白名单：仅允许抓取列表中的已知来源，绝不自动发现新地址
  whitelist:
    - "http://forum-alpha-sample.onion/threads/4827"
  max_capture_chars: 2000
  max_items: 20
  timeout: 15

alert:
  enabled: false
  email:
    smtp_host: ${SMTP_HOST:-}
    smtp_port: 587
    username: ${SMTP_USER:-}
    password: ${SMTP_PASS:-}
    use_tls: true
    from: ${SMTP_USER:-}
    to: []
  lark:
    webhook_url: ${LARK_WEBHOOK_URL:-}
    secret: null

# Public OSINT sources (all合法公开源)
sources:
  - name: nvd_recent
    type: api
    url: https://services.nvd.nist.gov/rest/json/cves/2.0
    params:
      resultsPerPage: 20
      pubStartDate: ""
    enabled: true

  - name: github_advisory
    type: api
    url: https://api.github.com/advisories
    params:
      per_page: 20
    title_field: summary
    url_field: html_url
    text_fields:
      - summary
      - description
    enabled: true

  - name: krebs_security
    type: rss
    url: https://krebsonsecurity.com/feed/
    enabled: true

  - name: dark_reading
    type: rss
    url: https://www.darkreading.com/rss.xml
    enabled: false
